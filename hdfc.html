<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HDFC Farmers Loan</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #4CAF50;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h1, h2, h3 {
      color: #f1f5f1;
    }

    ul {
      line-height: 1.6;
    }

    .language-selector {
      text-align: center;
      margin: 20px 0;
    }

    .language-selector button {
      padding: 10px 15px;
      margin: 0 5px;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid #4CAF50;
      background-color: white;
      color: #4CAF50;
      border-radius: 5px;
    }

    .language-selector button:hover {
      background-color: #4CAF50;
      color: white;
    }

    .apply-button {
      display: block;
      width: 200px;
      margin: 20px auto;
      text-align: center;
    }

    .apply-button button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .apply-button button:hover {
      background-color: #45a049;
    }

    .section {
      margin-bottom: 20px;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .section h2 {
      color: #4CAF50;
    }

    .feature-list, .interest-list, .eligibility-list, .documents-list, .benefits-list {
      padding-left: 20px;
      list-style-type: disc;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="title">HDFC Farmers Loan</h1>
  </header>

  <div class="container">
    <!-- Language selection -->
    <div class="language-selector">
      <button onclick="setLanguage('en')">English</button>
      <button onclick="setLanguage('hi')">हिंदी</button>
      <button onclick="setLanguage('ta')">தமிழ்</button>
    </div>

    <div class="section">
      <h2 id="about"></h2>
      <p id="description"></p>
    </div>

    <div class="section">
      <h2 id="features"></h2>
      <ul id="featuresList" class="feature-list"></ul>
    </div>

    <div class="section">
      <h2 id="interest"></h2>
      <ul id="interestList" class="interest-list"></ul>
    </div>

    <div class="section">
      <h2 id="eligibility"></h2>
      <ul id="eligibilityList" class="eligibility-list"></ul>
    </div>

    <div class="section">
      <h2 id="documents"></h2>
      <ul id="documentsList" class="documents-list"></ul>
    </div>

    <div class="section">
      <h2 id="benefits"></h2>
      <ul id="benefitsList" class="benefits-list"></ul>
    </div>

    <div class="apply-button">
      <a href="https://www.hdfcbank.com/personal/borrow/popular-loans/kisan-gold-card" class="button-link" target="_blank">
        <button>Apply Now</button>
      </a>
    </div>
  </div>

  <script>
    const hdfcTranslations = {
      en: {
        title: "HDFC Farmers Loan",
        about: "About the Scheme",
        description: "HDFC offers a variety of financial products tailored to meet the needs of farmers. The HDFC Farmers Loan helps farmers finance their agricultural activities, including crop production, farm machinery, and irrigation systems.",
        features: "Features",
        featuresList: [
          "Loans available for crop production, farm machinery, irrigation, etc.",
          "Flexible repayment tenure.",
          "Easy processing and quick disbursal of loans.",
          "Available for individual farmers, groups, and cooperatives."
        ],
        interest: "Interest Rates and Loan Details",
        interestList: [
          "Interest rates depend on the loan type and tenure.",
          "Competitive rates for long-term loans.",
          "Repayment tenure ranges up to 7 years.",
          "Loans available for both short-term and long-term projects."
        ],
        eligibility: "Eligibility",
        eligibilityList: [
          "Farmers (individuals, groups, and cooperatives).",
          "Farmer Producer Organizations (FPOs).",
          "Self-Help Groups (SHGs) involved in agricultural activities."
        ],
        documents: "Documents Required",
        documentsList: [
          "Loan application form.",
          "Proof of land ownership or lease agreement.",
          "Project report (for term loans).",
          "KYC documents (Aadhaar, PAN, etc.).",
          "Photographs."
        ],
        benefits: "Benefits",
        benefitsList: [
          "Financial support for agricultural development.",
          "Competitive interest rates with flexible repayment terms.",
          "Supports farmers with modern farming equipment.",
          "Helps improve agricultural productivity and income."
        ]
      },
      hi: {
        title: "HDFC किसान ऋण",
        about: "योजना के बारे में",
        description: "HDFC किसानों की ज़रूरतों के मुताबिक विभिन्न वित्तीय उत्पादों की पेशकश करता है। HDFC किसान ऋण किसानों को अपनी कृषि गतिविधियों, जैसे फसल उत्पादन, कृषि मशीनरी और सिंचाई प्रणालियों को वित्तीय सहायता प्रदान करने में मदद करता है।",
        features: "विशेषताएँ",
        featuresList: [
          "फसल उत्पादन, कृषि मशीनरी, सिंचाई आदि के लिए ऋण उपलब्ध।",
          "लचीली पुनर्भुगतान अवधि।",
          "आसान प्रसंस्करण और त्वरित ऋण वितरण।",
          "व्यक्तिगत किसानों, समूहों और सहकारी समितियों के लिए उपलब्ध।"
        ],
        interest: "ब्याज दरें और ऋण विवरण",
        interestList: [
          "ब्याज दरें ऋण प्रकार और अवधि पर निर्भर करती हैं।",
          "दीर्घकालिक ऋणों के लिए प्रतिस्पर्धी दरें।",
          "ऋण पुनर्भुगतान अवधि 7 वर्ष तक हो सकती है।",
          "छोटे और दीर्घकालिक परियोजनाओं के लिए ऋण उपलब्ध।"
        ],
        eligibility: "पात्रता",
        eligibilityList: [
          "किसान (व्यक्तिगत, समूह और सहकारी समितियाँ)।",
          "किसान उत्पादक संगठन (FPOs)।",
          "कृषि गतिविधियों में शामिल स्व-सहायता समूह (SHGs)।"
        ],
        documents: "आवश्यक दस्तावेज़",
        documentsList: [
          "ऋण आवेदन पत्र।",
          "भूमि स्वामित्व प्रमाण या पट्टा समझौता।",
          "परियोजना रिपोर्ट (टर्म लोन के लिए)।",
          "KYC दस्तावेज़ (आधार, पैन आदि)।",
          "फोटो।"
        ],
        benefits: "लाभ",
        benefitsList: [
          "कृषि विकास के लिए वित्तीय सहायता।",
          "प्रतिस्पर्धी ब्याज दरें और लचीली पुनर्भुगतान शर्तें।",
          "कृषि यांत्रिकीकरण के लिए समर्थन।",
          "कृषि उत्पादकता और आय में सुधार के लिए मदद करता है।"
        ]
      },
      ta: {
        title: "HDFC விவசாயக் கடன்",
        about: "திட்டத்தைப் பற்றி",
        description: "HDFC விவசாயிகளின் தேவைகளை பூர்த்தி செய்ய பல்வேறு நிதி தயாரிப்புகளை வழங்குகிறது. HDFC விவசாயக் கடன் விவசாயிகளுக்கு பண்ணை உற்பத்தி, விவசாய இயந்திரங்கள் மற்றும் நீர்ப்பாசன அமைப்புகளைப் போன்ற விவசாய நடவடிக்கைகளை நிதியுதவி செய்ய உதவுகிறது.",
        features: "அம்சங்கள்",
        featuresList: [
          "பயிர் உற்பத்தி, விவசாய இயந்திரங்கள், நீர்ப்பாசன உள்ளிட்டவற்றுக்கான கடன்கள்.",
          "வசதியான மறுபணம் பெறும் காலம்.",
          "எளிதாக செயலாக்கம் மற்றும் விரைவான கடன் நிதியீடு.",
          "தனிப்பட்ட விவசாயிகள், குழுக்கள் மற்றும் கூட்டுறவு நிறுவனங்களுக்கு கிடைக்கும்."
        ],
        interest: "வட்டி விகிதங்கள் மற்றும் கடன் விவரங்கள்",
        interestList: [
          "வட்டி விகிதங்கள் கடன் வகை மற்றும் கால அளவின் அடிப்படையில் மாற்றம் அடையும்.",
          "நீண்டகால கடன்களுக்கான போட்டித்தன்மை வாய்ந்த வட்டிகள்.",
          "கடன் மறுபணம் பெறும் காலம் 7 ஆண்டுகளுக்கு வரை.",
          "சிறிய மற்றும் நீண்டகால திட்டங்களுக்கு கடன்கள் கிடைக்கும்."
        ],
        eligibility: "பத்திபெறுகை",
        eligibilityList: [
          "விவசாயிகள் (தனிப்பட்டவர்கள், குழுக்கள் மற்றும் கூட்டுறவுகள்).",
          "விவசாயி தயாரிப்பு அமைப்புகள் (FPOs).",
          "விவசாய நடவடிக்கைகளில் ஈடுபட்டுள்ள சுய உதவி குழுக்கள் (SHGs)."
        ],
        documents: "தேவைப்படும் ஆவணங்கள்",
        documentsList: [
          "கடன் விண்ணப்பப் படிவம்.",
          "நில உரிமை சான்று அல்லது வாடகை ஒப்பந்தம்.",
          "திட்ட அறிக்கை (கால அவகாச கடன்களுக்கு).",
          "KYC ஆவணங்கள் (ஆதார், பான் எனும்).",
          "புகைப்படங்கள்."
        ],
        benefits: "பயன்கள்",
        benefitsList: [
          "விவசாயத் துறையின் வளர்ச்சிக்கான நிதி ஆதரவு.",
          "போட்டி வட்டி விகிதங்களும் மற்றும் நீண்டகால பணம் திரும்ப பெறும் கால அளவும்.",
          "விவசாய இயந்திரமயமாக்கலை மற்றும் நவீனமயமாக்கலையும் ஆதரிக்கும்.",
          "கிராமப்புற சமூகங்களுக்கு நிதி பாதுகாப்பு வழங்குகிறது."
        ]
      }
    };

    function setLanguage(language) {
      document.getElementById('title').textContent = hdfcTranslations[language].title;
      document.getElementById('about').textContent = hdfcTranslations[language].about;
      document.getElementById('description').textContent = hdfcTranslations[language].description;
      document.getElementById('features').textContent = hdfcTranslations[language].features;
      document.getElementById('featuresList').innerHTML = hdfcTranslations[language].featuresList.map(item => `<li>${item}</li>`).join('');
      document.getElementById('interest').textContent = hdfcTranslations[language].interest;
      document.getElementById('interestList').innerHTML = hdfcTranslations[language].interestList.map(item => `<li>${item}</li>`).join('');
      document.getElementById('eligibility').textContent = hdfcTranslations[language].eligibility;
      document.getElementById('eligibilityList').innerHTML = hdfcTranslations[language].eligibilityList.map(item => `<li>${item}</li>`).join('');
      document.getElementById('documents').textContent = hdfcTranslations[language].documents;
      document.getElementById('documentsList').innerHTML = hdfcTranslations[language].documentsList.map(item => `<li>${item}</li>`).join('');
      document.getElementById('benefits').textContent = hdfcTranslations[language].benefits;
      document.getElementById('benefitsList').innerHTML = hdfcTranslations[language].benefitsList.map(item => `<li>${item}</li>`).join('');
    }

    setLanguage('en');
  </script>

</body>
</html>
